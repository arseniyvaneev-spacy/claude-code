name: "Pin probe (temporary, do not merge)"

# Temporary check that "Require actions to be pinned to a full-length commit
# SHA" is enforced. The pinned job must run; the unpinned job must be refused
# by GitHub before it starts. This file is never meant to reach main.
on:
  pull_request:
    paths:
      - ".github/workflows/pin-probe.yml"

permissions:
  contents: read

jobs:
  pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: echo "pinned action ran"

  unpinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: echo "unpinned action ran - the setting is NOT enforced"
