name: "Hook tests"

# Runs the push-guard test matrix whenever the guard, its tests, the agent that
# uses it, or this workflow change. The job does not call Claude, so the
# hardening rules for Claude jobs in CLAUDE.md do not apply to it.
on:
  pull_request:
    paths:
      - ".claude/hooks/**"
      - ".claude/agents/github-maintainer.md"
      - ".github/workflows/hook-tests.yml"

permissions:
  contents: read

jobs:
  guard-git:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Check tools
        run: |
          python3 --version
          jq --version

      - name: Run push-guard test matrix
        run: .claude/hooks/guard-git.test.sh
